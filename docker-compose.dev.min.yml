services:

  backend:
    env_file: .env

    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    expose:
      - "8080"

    ports:
      - "8080:8080"

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - ./backend:/app
      - ./elastic/filebeat/ingest_data:/var/log/api
      - uploads_data:/app/uploads

    environment:
      GIN_MODE: debug

    networks:
      - redis
      - back-front
      - db-back



  frontend:
    env_file: .env

    build:
      context: ./frontend
      dockerfile: Dockerfile

    expose:
      - "3000"

    volumes:
      - /app/node_modules
      - ./frontend:/app

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - back-front

    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}


  postgres:
    env_file: .env

    image: postgres:17.11

    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    expose:
      - "5432"

    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - db-back


  redis:
    env_file: .env

    image: redis:7

    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"

    ports:
      - "7777:6379"

    restart: unless-stopped

    volumes:
      - redis_data:/data

    networks:
      - redis

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5


  nginx:
    build:
      context: ./nginx

    env_file: .env

    ports:
      - "8081:80"
      - "8443:8443"
      - "1312:80"
      - "6969:443"

    volumes:
      - ./nginx/default.min.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    networks:
      - back-front


volumes:
  postgres_data:
  redis_data:
  uploads_data:


networks:
  db-back:
  back-front:
  redis: