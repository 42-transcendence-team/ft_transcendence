# docker-compose.dev.min.yml
# Stack mínimo de desarrollo:
# backend + frontend + nginx + postgres + redis

services:

  backend:
    env_file:
      - .env
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    expose:
      - "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    environment:
      GIN_MODE: debug
    networks:
      - redis
      - back-front
      - db-back

  frontend:
    env_file:
      - .env
    build:
      context: ./frontend
    expose:
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - ./frontend:/app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    networks:
      - back-front

  postgres:
    env_file:
      - .env
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-back

  redis:
    env_file:
      - .env
    image: redis:7
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    expose:
      - "6379"
    ports:
      - "7777:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - redis

  nginx:
    build:
      context: ./nginx
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - ./nginx/default.min.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - back-front


volumes:
  postgres_data:
  redis_data:
  uploads_data:


networks:
  db-back:
  back-front:
  redis: