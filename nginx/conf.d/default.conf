# ============================================================
# FRONTEND
# http://localhost:1312 -> https://localhost:6969
# ============================================================

server {
    listen 80;
    server_name localhost;

    return 301 https://$http_host:6969$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/nginx.crt;
    ssl_certificate_key /etc/ssl/private/nginx.key;

    client_max_body_size 10M;

    # --------------------------------------------------------
    # Uploads -> Backend
    # --------------------------------------------------------
    location /uploads/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 6969;

        proxy_intercept_errors on;
        error_page 404 =404 /__frontend_404;
    }

    # --------------------------------------------------------
    # Frontend 404
    # --------------------------------------------------------
    location = /__frontend_404 {
        internal;

        proxy_pass http://frontend:3000/;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 6969;
    }

    # --------------------------------------------------------
    # Frontend
    # --------------------------------------------------------
    location / {
        proxy_pass http://frontend:3000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 6969;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --------------------------------------------------------
    # API -> Backend
    # --------------------------------------------------------
    location /api {
        proxy_pass http://backend:8080;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 6969;
    }

    # --------------------------------------------------------
    # WebSocket
    # --------------------------------------------------------
    location /api/v1/websocket/ws {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 6969;

        proxy_read_timeout 86400;
    }
}


# ============================================================
# PGADMIN
# ============================================================

server {
    listen 80;
    server_name pgadmin.localhost;

    return 301 https://$host:6969$request_uri;
}

server {
    listen 443 ssl;
    server_name pgadmin.localhost;

    ssl_certificate /etc/ssl/certs/nginx.crt;
    ssl_certificate_key /etc/ssl/private/nginx.key;

    location / {
        proxy_pass http://pgadmin:80;

        proxy_set_header Host $http_host;
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 6969;
    }
}


