server {
	listen 80;
	server_name localhost;

	return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/nginx.crt;
    ssl_certificate_key /etc/ssl/private/nginx.key;

    client_max_body_size 10M;

	location /uploads/ {
	    proxy_pass http://backend:8080;

	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;

	    # Las imágenes válidas siguen sirviéndose desde el backend.
	    # Si el archivo no existe, Nginx carga la aplicación React
	    # manteniendo un estado HTTP 404.
	    proxy_intercept_errors on;
	    error_page 404 =404 /__frontend_404;
	}

	location = /__frontend_404 {
	    internal;
	
	    # Se solicita la raíz al servidor frontend para recibir index.html.
	    # El navegador conserva la URL original /uploads/..., por lo que
	    # React Router termina mostrando su ruta comodín de NotFound.
	    proxy_pass http://frontend:3000/;
	
	    proxy_set_header Host $host;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	}

    location / {
        proxy_pass http://frontend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_read_timeout 86400;
    }
}

# NOTE - Para que funcione el subdominio se debe editar el archivo /etc/hosts y agregar la línea:
# 127.0.0.1 pgadmin.localhost
server {
    listen 80;
    server_name pgadmin.localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pgadmin.localhost;

    ssl_certificate /etc/ssl/certs/nginx.crt;
    ssl_certificate_key /etc/ssl/private/nginx.key;

    location / {
        proxy_pass http://pgadmin:80;

        proxy_set_header Host $host;
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

