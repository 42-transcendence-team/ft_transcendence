# Config mínima para desarrollo ligero (docker-compose.dev.min.yml).
# Solo proxy hacia backend y frontend.  No incluye los server blocks de
# pgadmin / docs / grafana / kibana / redisinsight / portainer porque esos
# servicios no existen en el compose ligero y nginx fallaría al resolver
# esos hostnames al arrancar ("host not found in upstream").

server {
	listen 80;
	server_name localhost;

	return 301 https://$host:6969$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/certs/nginx.crt;
    ssl_certificate_key /etc/ssl/private/nginx.key;

    return 301 https://$host:6969$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/nginx.crt;
    ssl_certificate_key /etc/ssl/private/nginx.key;

    client_max_body_size 10M;

	location /uploads/ {
	    proxy_pass http://backend:8080;

	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;

	    # Las imágenes válidas siguen sirviéndose desde el backend.
	    # Si el archivo no existe, Nginx carga la aplicación React
	    # manteniendo un estado HTTP 404.
	    proxy_intercept_errors on;
	    error_page 404 =404 /__frontend_404;
	}

	location = /__frontend_404 {
	    internal;

	    # Se solicita la raíz al servidor frontend para recibir index.html.
	    # El navegador conserva la URL original /uploads/..., por lo que
	    # React Router termina mostrando su ruta comodín de NotFound.
	    proxy_pass http://frontend:3000/;

	    proxy_set_header Host $host;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	}

    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
    }

    location /api {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/websocket/ws {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_read_timeout 86400;
    }
}
