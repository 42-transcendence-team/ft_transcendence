services:
    backend:
        env_file: .env # No se donde se guardara el archivo .env por ahora lo linkea de la raiz del proyecto
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        expose:
            - "8080"
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        # Falta hacer el healthcheck para el backend, para que el frontend dependa de el.
        volumes:
          - ./backend:/app
        environment:
          - GIN_MODE=debug
        networks:
            - redis
            - back-front
            - db-back

    frontend:
        env_file: .env # No se donde se guardara el archivo .env por ahora lo linkea de la raiz del proyecto
        build:
            context: ./frontend
        expose:
            - "3000"
        volumes:
            - /app/node_modules
            - ./frontend:/app # Comparte el codigo fuente como volumen, por que los cambios se reflejan directamente en el contenedor
        restart: unless-stopped
        depends_on:
            - backend
        networks:
            - back-front
        environment:
            - PUBLIC_API_URL=${PUBLIC_API_URL}

    postgres:
        env_file: .env # No se donde se guardara el archivo .env por ahora lo linkea de la raiz del proyecto
        image: postgres:latest # Por definir que version de postgres usar
        environment:
            POSTGRES_USER: "${DB_USER}"
            POSTGRES_PASSWORD: "${DB_PASSWORD}"
            POSTGRES_DB: "${DB_NAME}"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
        expose:
            - "5432"
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql # Carpeta temporal para pruebas. Por definir donde se guardaran los datos de postgres
        networks:
            - db-view
            - db-back


    pgadmin:
        env_file: .env
        image: dpage/pgadmin4:latest # Visualizador de base de datos en la web para poder administrarla de forma mas sencilla y visual.
        environment:
            PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
            PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
        expose:
            - "80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - db-view
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
    redis:
        env_file: .env
        image: redis:latest
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - "${REDIS_PORT}:6379"
        restart: always
        volumes:
            - redis_data:/data
        networks:
            - redis
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    nginx:
        build:
          context: ./nginx

        ports:
          - "80:80"
          - "443:443"

        depends_on:
          backend:
            condition: service_started
          frontend:
            condition: service_started
          docusaurus:
            condition: service_started

        networks:
          - back-front
          - db-view
          - docs-view
          - monitoring

    docusaurus:
        build:
          context: ./docusaurus
        expose:
            - "3000"
        volumes:
          - ./docusaurus:/app
          - /app/node_modules
        restart: unless-stopped
        networks:
            - docs-view
            - back-front

    prometheus:
        build: 
            context: ./prometheus
        volumes:
            - prometheus_data:/prometheus
        expose:
            - "9090"
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
        networks:
            - monitoring

    grafana:
        build:
            context: ./grafana
        volumes:
            - grafana_data:/var/lib/grafana
        expose:
            - "3000"
        depends_on:
            - prometheus
        networks:
            - monitoring

    # 
    node-exporter:
        image: prom/node-exporter:latest
        expose:
            - "9100"
        networks:
            - monitoring


volumes:
    postgres_data:
    pgadmin_data:
    redis_data:
    prometheus_data:
    grafana_data:


networks:
    db-view:
    db-back:
    back-front: 
    redis:
    docs-view:
    monitoring:
