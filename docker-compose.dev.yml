services:
    backend:
        env_file: .env # No se donde se guardara el archivo .env por ahora lo linkea de la raiz del proyecto
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        expose:
            - "8080"
        ports:
            - "8080:8080"
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        # Falta hacer el healthcheck para el backend, para que el frontend dependa de el.
        volumes:
          - ./backend:/app
        environment:
          - GIN_MODE=debug
        networks:
            - redis
            - back-front
            - db-back
            - monitoring

    frontend:
        env_file: .env # No se donde se guardara el archivo .env por ahora lo linkea de la raiz del proyecto
        build:
            context: ./frontend
        expose:
            - "3000"
        volumes:
            - /app/node_modules
            - ./frontend:/app # Comparte el codigo fuente como volumen, por que los cambios se reflejan directamente en el contenedor
        restart: unless-stopped
        depends_on:
            - backend
        networks:
            - back-front
        environment:
            - PUBLIC_API_URL=${PUBLIC_API_URL}

    postgres:
        env_file: .env # No se donde se guardara el archivo .env por ahora lo linkea de la raiz del proyecto
        image: postgres:latest # Por definir que version de postgres usar
        environment:
            POSTGRES_USER: "${DB_USER}"
            POSTGRES_PASSWORD: "${DB_PASSWORD}"
            POSTGRES_DB: "${DB_NAME}"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
        expose:
            - "5432"
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql # Carpeta temporal para pruebas. Por definir donde se guardaran los datos de postgres
        networks:
            - db-view
            - db-back


    pgadmin:
        env_file: .env
        image: dpage/pgadmin4:latest # Visualizador de base de datos en la web para poder administrarla de forma mas sencilla y visual.
        environment:
            PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
            PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
        expose:
            - "80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - db-view
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
    redis:
        env_file: .env
        image: redis:latest
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - "${REDIS_PORT}:6379"
        restart: always
        volumes:
            - redis_data:/data
        networks:
            - redis
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    nginx:
        build:
          context: ./nginx

        ports:
          - "80:80"
          - "443:443"

        depends_on:
          backend:
            condition: service_started
          frontend:
            condition: service_started
          docusaurus:
            condition: service_started
          kibana:
            condition: service_started
          grafana:
            condition: service_started

        networks:
          - back-front
          - db-view
          - docs-view
          - monitoring # TODO - Revisar las redes que son compartidas con NGINX
          - elastic
          - port-nginx

    docusaurus:
        build:
          context: ./docusaurus
        expose:
            - "3000"
        volumes:
          - ./docusaurus:/app
          - /app/node_modules
        restart: unless-stopped
        networks:
            - docs-view
            - back-front

    prometheus:
        build: 
            context: ./prometheus
        volumes:
            - prometheus_data:/prometheus
        expose:
            - "9090"
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
        networks:
            - monitoring

    grafana:
        env_file: .env
        build:
            context: ./grafana
        volumes:
            - grafana_data:/var/lib/grafana
        expose:
            - "3000"
        depends_on:
            - prometheus
        networks:
            - monitoring

    # 
    node-exporter:
        image: prom/node-exporter:latest
        expose:
            - "9100"
        networks:
            - monitoring
    # Disabled for WSL compatibility
    # Required for full host metrics on Linux
        # command: 
        #   - '--path.rootfs=/host'
        # volumes:
        #   - '/:/host:ro,rslave'
          
    cadvisor:
      image: gcr.io/cadvisor/cadvisor:latest
      container_name: cadvisor
      restart: unless-stopped
      expose:
        - "8080"
      networks:
        - monitoring
      volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
        - /var/lib/docker:/var/lib/docker:ro

    elastic-setup:
        image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
        env_file: .env
        user: "0"
        volumes:
          - certs_data:/usr/share/elasticsearch/config/certs
          - ./elastic/setup/setup.sh:/usr/share/elasticsearch/setup.sh:ro
        networks:
          - elastic
        command: /usr/share/elasticsearch/setup.sh
        healthcheck:
          test: ["CMD-SHELL", "[ -f config/certs/elasticsearch/elasticsearch.crt ]"]
          interval: 2s
          timeout: 5s
          retries: 60
  
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
        env_file: .env
        depends_on:
          elastic-setup:
            condition: service_started
        expose:
          - ${ES_PORT}
        volumes:
          - certs_data:/usr/share/elasticsearch/config/certs
          - elastic_data:/usr/share/elasticsearch/data
          - ./elastic/elasticsearch/config.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
        networks:
          - elastic
        mem_limit: ${ES_MEM_LIMIT}
        ulimits:
          memlock:
            soft: -1
            hard: -1
        healthcheck:
            test:
              [
                "CMD-SHELL",
                "curl -s -k https://localhost:9200 | grep -q 'missing authentication credentials'",
              ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s

    kibana:
        image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
        env_file: .env
        depends_on:
          elasticsearch:
            condition: service_healthy
        expose:
          - ${KIBANA_PORT}
        volumes:
          - certs_data:/usr/share/kibana/config/certs
          - kibana_data:/usr/share/kibana/data
          - ./elastic/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
        networks:
          - elastic
        mem_limit: ${KB_MEM_LIMIT}
        healthcheck:
          test:
            [
              "CMD-SHELL",
              "curl -s http://localhost:5601/api/status | grep -q '\"state\":\"green\"'",
            ]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 60s

    # Puede dar error por permisos de usuario, en ese caso hacer en terminal "sudo chown root:root ./elastic/metricbeat/metricbeat.yml"
    metricbeat:
        image: docker.elastic.co/beats/metricbeat:${STACK_VERSION}
        env_file: .env
        user: root
        volumes:
          - metricbeat_data:/usr/share/metricbeat/data
          - certs_data:/usr/share/metricbeat/certs
          - ./elastic/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
          - /proc:/hostfs/proc:ro
          - /:/hostfs:ro
        networks:
          - elastic
        command: ["metricbeat", "-e", "--strict.perms=false"]
        depends_on:
          elasticsearch:
            condition: service_started
          kibana:
            condition: service_started

    filebeat:
        image: docker.elastic.co/beats/filebeat:${STACK_VERSION}
        env_file: .env
        user: root
        volumes:
          - filebeat_data:/usr/share/filebeat/data
          - certs_data:/usr/share/filebeat/certs
          - ./elastic/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
          - ./elastic/filebeat/ingest_data:/usr/share/filebeat/ingest_data:ro
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - /var/lib/docker/containers:/var/lib/docker/containers:ro
        networks:
          - elastic
        command: ["filebeat", "-e", "--strict.perms=false"]
        depends_on:
          elasticsearch:
            condition: service_started
          kibana:
            condition: service_started
        
    logstash:
        image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
        env_file: .env
        group_add:
          - 0 
        volumes:
          - logstash_data:/usr/share/logstash/data
          - certs_data:/usr/share/logstash/certs:ro
          - ./elastic/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
          - ./elastic/logstash/ingest_data:/usr/share/logstash/ingest_data:ro
        networks:
          - elastic
        environment:
          - xpack.monitoring.enabled=false
          - ELASTIC_HOSTS=https://elasticsearch:9200
        depends_on:
          elasticsearch:
            condition: service_started
          kibana:
            condition: service_started
    portainer:
        image: portainer/portainer-ce:sts
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data
        expose:
            - "9443"
            - "9000"
        restart: unless-stopped
        networks:
            - port-nginx

volumes:
    postgres_data:
    pgadmin_data:
    redis_data:
    prometheus_data:
    grafana_data:
    elastic_data:
    kibana_data:
    metricbeat_data:
    filebeat_data:
    logstash_data:
    certs_data:
# TODO - Revisar las redes creadas para la correcta separación y aislamiento entre contenedores
    portainer_data:

networks:
    db-view:
    db-back:
    back-front: 
    redis:
    docs-view:
    monitoring:
    elastic:
    port-nginx:
