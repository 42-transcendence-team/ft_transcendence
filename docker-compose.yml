services:

  backend:
    env_file:
      - .env

    build:
      context: ./backend
      dockerfile: Dockerfile

    expose:
      - "8080"

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads

    networks:
      - redis
      - back-front
      - db-back
      - monitoring
      - api-logs

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    env_file:
      - .env

    build:
      context: ./frontend
      dockerfile: Dockerfile

    expose:
      - "3000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - back-front


  postgres:
    env_file:
      - .env
    image: postgres:17.11

    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - db-view
      - db-back


  pgadmin:
    env_file:
      - .env

    image: dpage/pgadmin4:latest

    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"

    expose:
      - "80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - db-view

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy


  redis:
    env_file:
      - .env

    image: redis:7

    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"

    expose:
      - "6379"

    restart: unless-stopped

    volumes:
      - redis_data:/data

    networks:
      - redis

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5


  redisinsight:
    env_file:
      - .env

    image: redislabs/redisinsight:latest

    expose:
      - "5540"

    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - redis
      - redis-view


  nginx:
    build:
      context: ./nginx
    env_file:
      - .env

    ports:
      - "${NGINX_REDIRECT_PORT:-8081}:80"
      - "${NGINX_HTTPS_REDIRECT_PORT:-8443}:8443"
      - "${NGINX_HTTP_PORT:-1312}:80"
      - "${NGINX_HTTPS_PORT:-6969}:443"

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      kibana:
        condition: service_healthy
      grafana:
        condition: service_started

    networks:
      - back-front
      - db-view
      - monitoring
      - elastic
      - redis-view
      - port-nginx


  prometheus:
    build:
      context: ./prometheus

    expose:
      - "9090"

    volumes:
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - monitoring


  grafana:
    env_file:
      - .env

    build:
      context: ./grafana

    expose:
      - "3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json

    depends_on:
      prometheus:
        condition: service_started

    networks:
      - monitoring

    restart: unless-stopped


  node-exporter:
    image: prom/node-exporter:latest

    expose:
      - "9100"

    networks:
      - monitoring


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest

    restart: unless-stopped

    expose:
      - "8081"

    networks:
      - monitoring

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${DOCKER_ROOT:-/var/lib/docker}:/var/lib/docker:ro


  elastic-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}

    env_file:
      - .env

    user: "0"

    volumes:
      - certs_data:/usr/share/elasticsearch/config/certs
      - ./elastic/setup/setup.sh:/usr/share/elasticsearch/setup.sh:ro

    networks:
      - elastic

    command:
      - /usr/share/elasticsearch/setup.sh

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ -f config/certs/elasticsearch/elasticsearch.crt ]"
        ]
      interval: 2s
      timeout: 5s
      retries: 60


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}

    env_file:
      - .env

    depends_on:
      elastic-setup:
        condition: service_healthy

    expose:
      - "9200"

    volumes:
      - certs_data:/usr/share/elasticsearch/config/certs
      - elastic_data:/usr/share/elasticsearch/data
      - ./elastic/elasticsearch/config.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro

    networks:
      - elastic

    mem_limit: ${ES_MEM_LIMIT}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -k https://localhost:9200 | grep -q 'missing authentication credentials'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}

    env_file:
      - .env

    depends_on:
      elasticsearch:
        condition: service_healthy

    expose:
      - "5601"

    volumes:
      - certs_data:/usr/share/kibana/config/certs
      - kibana_data:/usr/share/kibana/data
      - ./elastic/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro

    networks:
      - elastic

    mem_limit: ${KB_MEM_LIMIT}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:5601/api/status"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  metricbeat:
    image: docker.elastic.co/beats/metricbeat:${STACK_VERSION}

    env_file:
      - .env

    user: root

    restart: on-failure:5

    volumes:
      - metricbeat_data:/usr/share/metricbeat/data
      - certs_data:/usr/share/metricbeat/certs
      - ./elastic/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro

    networks:
      - elastic

    command:
      - metricbeat
      - -e
      - --strict.perms=false

    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy


  filebeat:
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION}

    env_file:
      - .env

    user: root

    restart: on-failure:5

    volumes:
      - filebeat_data:/usr/share/filebeat/data
      - certs_data:/usr/share/filebeat/certs
      - ./elastic/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./elastic/filebeat/ingest_data:/usr/share/filebeat/ingest_data:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro # docker context inspect --format '{{.Endpoints.docker.Host}}'
      - ${DOCKER_ROOT:-/var/lib/docker}/containers:/var/lib/docker/containers:ro # docker info --format '{{.DockerRootDir}}'

    networks:
      - elastic
      - api-logs

    command:
      - filebeat
      - -e
      - --strict.perms=false

    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      logstash:
        condition: service_started


  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}

    env_file:
      - .env

    expose:
      - "5044"

    group_add:
      - "0"

    volumes:
      - logstash_data:/usr/share/logstash/data
      - certs_data:/usr/share/logstash/certs:ro
      - ./elastic/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./elastic/logstash/ingest_data:/usr/share/logstash/ingest_data:ro

    networks:
      - elastic
      - api-logs

    environment:
      XPACK_MONITORING_ENABLED: "false"
      ELASTIC_HOSTS: "https://elasticsearch:9200"

    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy


  portainer:
    image: portainer/portainer-ce:sts

    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - portainer_data:/data

    expose:
      - "9443"
      - "9000"

    restart: unless-stopped

    networks:
      - port-nginx


volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  prometheus_data:
  grafana_data:
  uploads_data:
  elastic_data:
  kibana_data:
  metricbeat_data:
  filebeat_data:
  logstash_data:
  certs_data:
  portainer_data:


networks:
  db-view:
  db-back:
  back-front:
  redis:
  redis-view:
  monitoring:
  elastic:
  port-nginx:
  api-logs: