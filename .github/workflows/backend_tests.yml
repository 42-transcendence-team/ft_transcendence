name: backend tests

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit and integration tests
        run: go test ./...

      - name: Race detector (websocket + games + repository)
        run: go test -race ./internal/websocket/ ./internal/games/ ./internal/repository/
