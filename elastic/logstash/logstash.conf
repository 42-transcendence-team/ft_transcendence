input {
  beats {
    port => 5044
    ssl_enabled => false
  }
}

filter {
  json {
    source => "message"
  }
  date {
    match => [ "time", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "go_app"
    data_stream_namespace => "dev"
  }
  
  stdout { 
    codec => rubydebug 
  }
}