metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# TODO - Cambiar configuraciones a variabvles de entorno, como hosts, usuario, pass, etc.
metricbeat.modules:
  - module: elasticsearch
    xpack.enabled: true
    period: 10s
    hosts: ["https://elasticsearch:9200"]
    ssl.certificate_authorities: "/usr/share/metricbeat/certs/ca/ca.crt"
    ssl.certificate: "/usr/share/metricbeat/certs/elasticsearch/elasticsearch.crt"
    ssl.key: "/usr/share/metricbeat/certs/elasticsearch/elasticsearch.key"
    username: ${ELASTIC_USER}
    password: ${ELASTIC_PASSWORD}
    ssl.enabled: true

  - module: kibana
    metricsets:
      - stats
    period: 10s
    hosts: ["http://kibana:5601"]
    username: ${ELASTIC_USER}
    password: ${ELASTIC_PASSWORD}
    xpack.enabled: true

  - module: docker
    metricsets:
      - "container"
      - "cpu"
      - "diskio"
      - "healthcheck"
      - "info"
      - "memory"
      - "network"
    hosts: ["unix:///var/run/docker.sock"]
    period: 10s
    enabled: true

processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~

output.elasticsearch:
  hosts: ["https://elasticsearch:9200"]
  username: ${ELASTIC_USER}
  password: ${ELASTIC_PASSWORD}
  ssl:
    certificate_authorities: "/usr/share/metricbeat/certs/ca/ca.crt"
    certificate: "/usr/share/metricbeat/certs/elasticsearch/elasticsearch.crt"
    key: "/usr/share/metricbeat/certs/elasticsearch/elasticsearch.key"